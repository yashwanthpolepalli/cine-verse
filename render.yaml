# Render.com Blueprint — Backend deployment
# https://render.com/docs/blueprint-spec
version: "1"
services:
  - type: web
    name: cine-verse
    runtime: python
    region: ohio
    plan: free
    rootDir: backend
    repo: https://github.com/yashwanthpolepalli/cine-verse
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
