# Render.com Blueprint — Backend deployment
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cine-verse-api
    runtime: python
    region: singapore  # closest to India
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TMDB_API_KEY
        sync: false  # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false  # set to your Vercel URL
      - key: DATABASE_URL
        fromDatabase:
          name: cine-verse-db
          property: connectionString

databases:
  - name: cine-verse-db
    plan: free
    region: singapore
    databaseName: cineverse
    user: cineverse_user
